<!DOCTYPE html>
<html>
<head>
  <title>Alert Testing</title>
</head>
<body>
  <h2>Selenium Alert Testing Page</h2>

  <!-- Normal Alert -->
  <button onclick="alert('This is a Normal Alert!')">
    Show Normal Alert
  </button>
  <br><br>

  <!-- Confirmation Alert -->
  <button onclick="confirm('Do you want to continue?')">
    Show Confirmation Alert
  </button>
  <br><br>

  <!-- Prompt Alert -->
  <button onclick="prompt('What is your name?')">Show Prompt Alert</button>
  <br><br>

</body>
</html>
